name: PptSaz
options:
  bundleIdPrefix: ir.pptsaz
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: fa
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  PptSaz:
    type: application
    platform: iOS
    sources:
      - PptSaz
    dependencies:
      # آمار استفاده‌ی اپ (Google Analytics 4)؛ بدون FIREBASE_IOS_APP_ID در بیلد خاموش است (Stats.swift)
      - package: Firebase
        product: FirebaseAnalytics
    info:
      path: PptSaz/Info.plist
      properties:
        CFBundleDisplayName: پاورپوینت‌ساز
        CFBundleName: PptSaz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [fa]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities: [arm64]
        ITSAppUsesNonExemptEncryption: false
        # نسخه‌ی فروشگاه: direct (پیش‌فرض، درگاه Safari) یا sibapp (خرید درون‌برنامه‌ای سیب‌اپ)؛ در ساخت با PPTSAZ_STORE=sibapp عوض می‌شود
        PptSazStore: $(PPTSAZ_STORE)
        # آنالیتیکس: شناسه‌ها هنگام بیلد از GitHub Secrets می‌آیند (خالی = خاموش). فایل GoogleService-Info.plist لازم نیست.
        FirebaseAppID: $(FIREBASE_IOS_APP_ID)
        FirebaseSenderID: $(FIREBASE_SENDER_ID)
        # جمع‌آوری تا وقتی Stats.start آن را روشن نکند خاموش است
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        # اسکیم برگشت از سیب‌اپ: pptsaz://?purchase_id=…  (همین «pptsaz» را در پنل سیب‌اپ بخش خرید ← تنظیمات بسته‌ها بگذارید)
        CFBundleURLTypes:
          - CFBundleURLName: ir.pptsaz.app
            CFBundleURLSchemes: [pptsaz]
        LSApplicationQueriesSchemes: [sibapp]
        # --- قابلیت‌های iOS که حساب Apple Developer نمی‌خواهند ---
        # پیگیری ساخت در پس‌زمینه (BGTaskScheduler) و ادامه‌ی پخش صوت با قفل‌بودن گوشی
        UIBackgroundModes: [audio, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - ir.pptsaz.app.refresh
          - ir.pptsaz.app.poll
        # میان‌برهای نگه‌داشتن آیکن
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: ir.pptsaz.app.new
            UIApplicationShortcutItemTitle: ارائه‌ی جدید
            UIApplicationShortcutItemIconSymbolName: wand.and.stars
          - UIApplicationShortcutItemType: ir.pptsaz.app.files
            UIApplicationShortcutItemTitle: فایل‌ها
            UIApplicationShortcutItemIconSymbolName: folder.fill
        # دیده‌شدن پوشه‌ی اپ در Files ← On My iPhone
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # «Open in…» / «Copy to پاورپوینت‌ساز» برای فایل‌های منبع
        CFBundleDocumentTypes:
          - CFBundleTypeName: اسناد منبع
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
              - public.image
              - public.plain-text
              - public.html
              - public.json
              - public.comma-separated-values-text
              - org.openxmlformats.wordprocessingml.document
              - org.openxmlformats.presentationml.presentation
              - org.openxmlformats.spreadsheetml.sheet
              - public.audio
        NSCameraUsageDescription: برای اسکن کتاب یا برگه و استخراج متن آن به‌عنوان منبع ارائه
        NSMicrophoneUsageDescription: برای گفتن موضوع ارائه با صدا و تبدیل آن به متن
        NSFaceIDUsageDescription: برای قفل اپ با Face ID
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ir.pptsaz.app
        PPTSAZ_STORE: direct
        # شناسه‌های عمومی استریم iOS (داخل هر اپ منتشرشده دیده می‌شوند و محرمانه نیستند)؛ با env همنام در بیلد قابل تغییرند
        FIREBASE_IOS_APP_ID: "1:201290040240:ios:686d3aa4c2fb96f0b84c75"
        FIREBASE_SENDER_ID: "201290040240"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PptSaz/Info.plist
  PptSazTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PptSazTests
    dependencies:
      - target: PptSaz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ir.pptsaz.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PptSaz:
    build:
      targets:
        PptSaz: all
    test:
      targets:
        - PptSazTests
