name: Build iOS app (native)

# خروجی: artifact با نام pptsaz-ios شامل pptsaz-unsigned.ipa (بدون امضا؛ برای نصب با AltStore / Sideloadly / TrollStore)
# اگر secrets امضا (پایین) تنظیم شده باشند، pptsaz-signed.ipa هم ساخته می‌شود.

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios-app.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Unit tests (simulator)
        working-directory: ios
        run: |
          set -o pipefail
          UDID=$(python3 scripts/pick_sim.py)
          echo "Simulator: $UDID"
          xcodebuild test \
            -project PptSaz.xcodeproj -scheme PptSaz \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 60

      - name: Archive + unsigned IPA
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PptSaz.xcodeproj -scheme PptSaz \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/PptSaz.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 40
          APP=build/PptSaz.xcarchive/Products/Applications/PptSaz.app
          test -d "$APP" || { echo "::error::PptSaz.app not found in archive"; exit 1; }
          mkdir -p ../dist
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ../dist/pptsaz-unsigned.ipa Payload
          # آرشیو Xcode برای وقتی که روی یک مک بخواهید با SibApp Export خروجی بگیرید
          (cd build && zip -qry ../../dist/PptSaz.xcarchive.zip PptSaz.xcarchive)
          ls -la ../dist

      - name: Store screenshots (simulator, demo mode)
        working-directory: ios
        run: |
          set -eo pipefail
          UDID=$(python3 scripts/pick_sim.py --large)
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularMode active --cellularBars 4 --wifiBars 3 || true
          xcrun simctl ui "$UDID" appearance light || true
          xcodebuild build \
            -project PptSaz.xcodeproj -scheme PptSaz \
            -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 5
          SIMAPP=build-sim/Build/Products/Debug-iphonesimulator/PptSaz.app
          test -d "$SIMAPP"
          xcrun simctl install "$UDID" "$SIMAPP"
          mkdir -p ../dist/screenshots
          shot() {
            local name="$1"; shift
            xcrun simctl terminate "$UDID" ir.pptsaz.app >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" ir.pptsaz.app -demo YES "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "../dist/screenshots/$name.png"
          }
          shot 01-login -demoLogin YES
          shot 02-create -demoTab 0
          shot 03-progress -demoTab 0 -demoJob YES
          shot 04-files -demoTab 1
          shot 05-file-detail -demoTab 1 -demoFile YES
          shot 06-settings -demoTab 2
          shot 07-plans -demoTab 3 -demoScroll YES
          ls -la ../dist/screenshots

      - name: Build signed IPA (if signing secrets exist)
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_B64 }}
          CERT_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_B64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        working-directory: ios
        run: |
          if [ -z "$CERT_B64" ] || [ -z "$PROFILE_B64" ] || [ -z "$TEAM_ID" ]; then
            echo "Signing secrets not set; skipping signed IPA."
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p tmp "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p tmp "$KC"
          echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k tmp "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/p.mobileprovision"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/p.mobileprovision")")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/p.mobileprovision")")
          cp "$RUNNER_TEMP/p.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          xcodebuild archive \
            -project PptSaz.xcodeproj -scheme PptSaz \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/PptSaz.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY="Apple Distribution"
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>ir.pptsaz.app</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/PptSaz.xcarchive -exportPath build/export -exportOptionsPlist build/ExportOptions.plist
          cp build/export/*.ipa ../dist/pptsaz-signed.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: pptsaz-ios
          path: dist/*
