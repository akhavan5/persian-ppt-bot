name: Build Android app (native)

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android-app.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Restore keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KS_B64" && test -n "$KS_PASS" || { echo "::error::secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD are missing"; exit 1; }
          echo "$KS_B64" | base64 -d > android/pptsaz-release.keystore
          keytool -list -keystore android/pptsaz-release.keystore -storepass "$KS_PASS" -alias pptsaz | tail -3

      - name: Unit tests
        run: gradle -p android testBazaarDebugUnitTest --no-daemon --stacktrace

      - name: Build APK + AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/pptsaz-release.keystore
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # اختیاری (اعلان FCM)؛ اگر secret نباشد اعلان تبلیغاتی خاموش می‌ماند
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          # تبلیغات ادیوری: بدون ADIVERY_APP_ID در بیلد release تبلیغ ادیوری کاملاً خاموش است؛ هر جایگاهِ خالی هم همان نوع تبلیغ را خاموش می‌کند
          ADIVERY_APP_ID: ${{ secrets.ADIVERY_APP_ID }}
          ADIVERY_BANNER_PLACEMENT: ${{ secrets.ADIVERY_BANNER_PLACEMENT }}
          ADIVERY_INTERSTITIAL_PLACEMENT: ${{ secrets.ADIVERY_INTERSTITIAL_PLACEMENT }}
          ADIVERY_NATIVE_PLACEMENT: ${{ secrets.ADIVERY_NATIVE_PLACEMENT }}
          ADIVERY_REWARDED_PLACEMENT: ${{ secrets.ADIVERY_REWARDED_PLACEMENT }}
          # تپسل فعلاً خاموش است. برای روشن‌کردن دوباره: متغیر (Variable) مخزن به نام TAPSELL_ENABLED را روی true بگذارید
          TAPSELL_ENABLED: ${{ vars.TAPSELL_ENABLED }}
          # تبلیغات تپسل (فقط وقتی TAPSELL_ENABLED=true): بدون TAPSELL_APP_KEY در بیلد release تبلیغ کاملاً خاموش است؛ هر جایگاهِ خالی هم همان نوع تبلیغ را خاموش می‌کند
          TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
          TAPSELL_BANNER_ZONE: ${{ secrets.TAPSELL_BANNER_ZONE }}
          TAPSELL_INTERSTITIAL_ZONE: ${{ secrets.TAPSELL_INTERSTITIAL_ZONE }}
          TAPSELL_INTERSTITIAL_BANNER_ZONE: ${{ secrets.TAPSELL_INTERSTITIAL_BANNER_ZONE }}
          TAPSELL_NATIVE_BANNER_ZONE: ${{ secrets.TAPSELL_NATIVE_BANNER_ZONE }}
          TAPSELL_NATIVE_VIDEO_ZONE: ${{ secrets.TAPSELL_NATIVE_VIDEO_ZONE }}
          TAPSELL_REWARDED_ZONE: ${{ secrets.TAPSELL_REWARDED_ZONE }}
        run: gradle -p android assembleBazaarRelease assembleMyketRelease bundleBazaarRelease bundleMyketRelease --no-daemon --stacktrace

      - name: Verify APKs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist mappings
          for S in bazaar myket; do
            APK=android/app/build/outputs/apk/$S/release/app-$S-release.apk
            "$BT/apksigner" verify --print-certs "$APK" | head -5
            "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdk"
            cp "$APK" dist/pptsaz-$S.apk
            cp android/app/build/outputs/bundle/${S}Release/app-$S-release.aab dist/pptsaz-$S.aab
            # نقشه‌ی R8 برای خواندن گزارش کرش‌ها؛ برای هر نسخه نگه دارید
            # (در artifact جدا آپلود می‌شود تا دانلود APK/AAB سنگین نشود)
            cp android/app/build/outputs/mapping/${S}Release/mapping.txt mappings/mapping-$S.txt
          done
          # نسخه‌ی مایکت نباید هیچ نشانی از بازار داشته باشد
          if "$BT/aapt2" dump permissions dist/pptsaz-myket.apk | grep -qi bazaar; then
            echo "::error::myket APK still contains a Bazaar permission"; exit 1
          fi
          if ! "$BT/aapt2" dump permissions dist/pptsaz-myket.apk | grep -q "ir.mservices.market.BILLING"; then
            echo "::error::myket APK is missing ir.mservices.market.BILLING (manifest placeholders?)"; exit 1
          fi
          if "$BT/aapt2" dump xmltree --file AndroidManifest.xml dist/pptsaz-myket.apk | grep -qi farsitel; then
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml dist/pptsaz-myket.apk | grep -i -B6 farsitel
            echo "::error::myket APK manifest still references com.farsitel.bazaar"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pptsaz-android
          path: dist/*

      # نقشه‌های R8 (mapping-bazaar.txt و mapping-myket.txt) سنگین‌اند؛ جدا از APK/AAB آپلود می‌شوند تا دانلود اپ‌ها کند نشود
      - uses: actions/upload-artifact@v4
        with:
          name: pptsaz-mappings
          path: mappings/*

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 30, store: bazaar }
          - { api: 34, store: bazaar }
          - { api: 34, store: myket }
          - { api: 36, store: bazaar }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pptsaz-android
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          script: bash android/smoke.sh dist/pptsaz-${{ matrix.store }}.apk smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.store }}-api${{ matrix.api }}
          path: smoke-out/*
