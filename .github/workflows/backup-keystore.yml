name: Backup Android keystore (one-off)

# فقط یک‌بار اجرا کنید. کلید امضا را (که فقط داخل Secrets است) بدون رمزنگاری به‌صورت artifact می‌دهد تا دانلود کنید.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Export keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          test -n "$KS_B64" && test -n "$KS_PASS" || { echo "::error::secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD are required"; exit 1; }
          mkdir bk
          echo "$KS_B64" | base64 -d > bk/pptsaz-release.keystore
          keytool -list -keystore bk/pptsaz-release.keystore -storepass "$KS_PASS" -alias pptsaz | tail -3
          printf 'alias: pptsaz\nstore password: %s\npackage: ir.pptsaz.app\n' "$KS_PASS" > bk/INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: bk/*
          retention-days: 2
