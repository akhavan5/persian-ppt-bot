<style>
@font-face{font-family:Vazirmatn;font-style:normal;font-weight:100 900;font-display:swap;src:url(https://fonts.gstatic.com/s/vazirmatn/v16/Dxxo8j6PP2D_kU2muijlGMWWMmk.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
:root{--bg:#f8faff;--card:#fff;--text:#0f1b33;--muted:#5b6b86;--line:#e3e9f5;--primary:#2563eb;--primary-2:#06b6d4;--soft:#eef4ff;--radius:16px;--shadow:0 1px 2px rgba(15,27,51,.05),0 10px 30px rgba(37,99,235,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.9 Vazirmatn,Tahoma,system-ui,sans-serif;background-image:radial-gradient(900px 420px at 85% -80px,#dbe8ff 0,transparent 70%),radial-gradient(700px 360px at 5% 0,#d9f6fb 0,transparent 70%);background-repeat:no-repeat}
a{color:var(--primary)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;color:var(--text);text-decoration:none;margin:22px 0}
.brand i{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:20px;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 26px;text-align:center}
.code{font-size:3.2rem;font-weight:800;line-height:1.2;background:linear-gradient(135deg,var(--primary),var(--primary-2));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:1.5rem;margin:6px 0 10px;font-weight:800}
p{margin:0 0 14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:12px 24px;font-weight:700;text-decoration:none;background:linear-gradient(135deg,var(--primary),#1d4ed8);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.28)}
.links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.links a{border:1px dashed #c5d3ee;border-radius:999px;padding:5px 14px;font-size:.9rem;color:var(--text);text-decoration:none;background:#fff}
.links a:hover{border-color:var(--primary);color:var(--primary)}
a:focus-visible{outline:3px solid #93b4f8;outline-offset:2px;border-radius:6px}
</style>
