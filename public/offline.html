<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آفلاین هستید | پاورپوینت‌ساز فارسی</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Vazirmatn;font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/Vazirmatn-Regular.woff2) format("woff2")}
@font-face{font-family:Vazirmatn;font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/Vazirmatn-Bold.woff2) format("woff2")}
:root{--bg:#f8faff;--card:#fff;--text:#0f1b33;--muted:#5b6b86;--line:#e3e9f5;--primary:#2563eb;--primary-2:#06b6d4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:var(--bg);color:var(--text);font:16px/1.9 Vazirmatn,Tahoma,system-ui,sans-serif;background-image:radial-gradient(900px 420px at 85% -80px,#dbe8ff 0,transparent 70%),radial-gradient(700px 360px at 5% 0,#d9f6fb 0,transparent 70%);background-repeat:no-repeat}
.card{max-width:440px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 24px;text-align:center;box-shadow:0 1px 2px rgba(15,27,51,.05),0 10px 30px rgba(37,99,235,.08)}
.ic{width:64px;height:64px;margin:0 auto 12px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,var(--primary),var(--primary-2));box-shadow:0 8px 20px rgba(37,99,235,.3)}
h1{margin:0 0 6px;font-size:1.3rem}
p{margin:0 0 18px;color:var(--muted)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 26px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--primary-2))}
</style>
</head>
<body>
<main class="card">
  <div class="ic" aria-hidden="true">📡</div>
  <h1>اینترنت شما قطع است</h1>
  <p>ساخت پاورپوینت به اینترنت نیاز دارد. اتصال را بررسی کنید و دوباره تلاش کنید.</p>
  <button type="button" id="retry">تلاش دوباره</button>
</main>
<script>
document.getElementById("retry").addEventListener("click",function(){location.reload()});
addEventListener("online",function(){location.reload()});
</script>
</body>
</html>
