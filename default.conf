server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    client_max_body_size 100m;

    location = /__ip {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "remote_addr=$remote_addr | xff=$http_x_forwarded_for | real_ip=$http_x_real_ip | host=$http_host\n";
    }

    location / {
        proxy_pass https://persian-ppt-bot.umz1.workers.dev;

        proxy_ssl_server_name on;
        proxy_ssl_name persian-ppt-bot.umz1.workers.dev;
        proxy_set_header Host persian-ppt-bot.umz1.workers.dev;

        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-Host $http_host;
        proxy_set_header X-Proxy-Secret "1efdee344778a4e6c1ed7ff7169f9e800d63de19fd8b5a1b3afaaba760ddc858";

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
